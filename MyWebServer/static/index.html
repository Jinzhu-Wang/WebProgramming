<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>登录与注册</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        .form-container {
            width: 300px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        .form-container h3 {
            margin-bottom: 20px;
        }
        .form-container input {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        .button-group {
            display: flex;
            justify-content: space-between;
        }
        .form-container button {
            width: 48%;
            padding: 10px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .form-container button.login {
            background-color: #4CAF50;
        }
        .form-container button.login:hover {
            background-color: #45a049;
        }
        .form-container button.register {
            background-color: #008CBA;
        }
        .form-container button.register:hover {
            background-color: #006d93;
        }
        .links {
            margin-top: 20px;
            text-align: center;
        }
        .links button {
            padding: 10px 20px;
            background-color: #008CBA;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .links button:hover {
            background-color: #006d93;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h3>登录 / 注册</h3>
        <form id="auth-form" action="/login" method="post">
            <input type="text" name="username" placeholder="用户名" required="required">
            <input type="password" name="password" placeholder="密码" required="required">
            <div class="button-group">
                <button type="submit" class="login" onclick="setFormAction('/login')">登录</button>
                <button type="submit" class="register" onclick="setFormAction('/register')">注册</button>
            </div>
        </form>
    </div>

    <div class="links">
        <a href="/mhw"><button type="button">不想注册？看个猫图先</button></a>
        <a href="/fileserver"><button type="button">不想看猫？下载种子去</button></a>
    </div>

    <script>
        function setFormAction(action) {
            document.getElementById('auth-form').action = action;
        }
    </script>
</body>
</html>
